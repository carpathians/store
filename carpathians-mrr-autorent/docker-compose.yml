version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: carpathians-mrr-autorent_web_1
      APP_PORT: 3001

  web:
    image: ghcr.io/carpathians/mrr-autorent:latest
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATA_DIR: /data
      HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ghcr.io/carpathians/mrr-autorent:latest
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: ["node", "worker.mjs"]
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
