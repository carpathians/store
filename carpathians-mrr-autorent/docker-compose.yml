version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: carpathians-mrr-autorent_web_1
      APP_PORT: 3001

  web:
    image: ghcr.io/iemanuel/mrr-autorent:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    init: true
    environment:
      DATA_DIR: /data
      PORT: "3001"
    volumes:
      - ${APP_DATA_DIR}/data:/data
