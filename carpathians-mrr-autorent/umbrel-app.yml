releaseNotes: >-
  1.0.0 — Next.js App Router + dedicated worker process.


  - Web and worker share DATA_DIR (SQLite + candidates.json)

  - First-run setup wizard; same AutoRent rules (cooldown, ending-soon wait)

  - Umbrel compose: web + worker services
