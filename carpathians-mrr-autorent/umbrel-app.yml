id: carpathians-mrr-autorent
name: MRR AutoRent
tagline: Auto-rent Mining Rig Rentals deals from your Umbrel
icon: https://raw.githubusercontent.com/carpathians/store/main/carpathians-mrr-autorent/icon.png
category: finance
version: "1.0.2"
port: 8742
description: >-
  MRR AutoRent scans MiningRigRentals for affordable hashrate deals, builds
  multi-currency candidates, and can auto-rent when the worker is enabled.


  First run:


  1. Open the app — complete the setup wizard (API key + secret)


  2. Ensure Rent = Write on your MRR API key


  3. Pick a pool profile, tune filters, then enable AutoRent


  Runs as Next.js web + dedicated worker sharing SQLite under Umbrel app data.
  Umbrel login protects the UI via app_proxy.


  This app can spend your MRR balance when the worker is running — keep cooldown
  and filters conservative until you trust the setup.

