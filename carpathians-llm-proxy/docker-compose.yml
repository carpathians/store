version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: carpathians-llm-proxy_web_1
      APP_PORT: 8788

  web:
    image: ghcr.io/carpathians/llm-proxy:latest
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATA_DIR: /data
      HOST: "0.0.0.0"
      PORT: "8788"
      LLM_LLAMA_BACKEND: auto
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # GPU passthrough is host-specific. Mounting /dev/kfd or missing
    # video/render groups makes Compose skip creating `web` → app_proxy
    # "no such container". CPU works out of the box; add devices manually
    # on Umbrel if you need AMD/NVIDIA:
    #   devices: [/dev/dri:/dev/dri, /dev/kfd:/dev/kfd]
    #   group_add: [video, render]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
