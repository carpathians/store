manifestVersion: 1
id: carpathians-llm-proxy
name: LLM Proxy
tagline: Local GGUF models, chat, and OpenAI-compatible API on Umbrel
icon: https://raw.githubusercontent.com/carpathians/store/main/carpathians-llm-proxy/icon.png
category: ai
version: "0.9.20"
port: 8788
description: >-
  Download a GGUF model, run llama-server, and chat in the browser — or call
  OpenAI-compatible /v1 APIs.


  Uses Umbrel's GPU permission: /dev/dri is injected when present, otherwise
  inference falls back to CPU automatically.


  Umbrel login protects the UI via app_proxy.

developer: Carpathians
website: https://github.com/carpathians/store
submitter: Carpathians
submission: https://github.com/carpathians/store
repo: https://github.com/carpathians/llm-proxy
support: https://github.com/carpathians/store/issues
gallery:
  - https://raw.githubusercontent.com/carpathians/store/main/carpathians-llm-proxy/gallery-1.png
releaseNotes: >-
  0.9.20 — NVIDIA readiness + Umbrel toolkit patch

  - Detect PCI-only NVIDIA (VRAM 0 B) vs real nvidia-smi / /dev/nvidia* runtime
  - Clearer backend notes when Umbrel DRI path picks Intel instead of Quadro
  - GHCR image tagged 0.9.20 (pinned in store compose)

  0.9.19 — Agents webfetch + Chat Web tools

  - Agents gate starts with live webfetch (example.com) before write/read/edit
  - Chat: Web tools toggle for webfetch / web_search via /api/tools
  - Hot-patch friendly: /data/patches overlays server/agents/public
  - GHCR image tagged 0.9.19 (survives container recreate)

  0.9.18 — OpenCode tool lift, stream usage, LFM chat-only

  - Lift OpenCode-style `% WebFetch` / `% bash` text into real tool_calls
  - Strip invalid tool enum args (e.g. webfetch format=json) so OpenCode accepts
  - Pass --jinja to llama-server for chat-template native tool schemas
  - Inject stream_options.include_usage + forward usage trailers (OpenCode context %)
  - LFM / tiny models export tools:false (chat only); use Build for agent tools
  - GHCR image tagged 0.9.18 (survives container recreate)

  0.9.17 — Exact model resolve (no newest-GGUF fallback)

  - resolve_model maps OpenAI/OpenCode ids to exact local GGUF only
  - Unknown/ambiguous ids return 404; bare local needs a loaded model
  - UI chat sends the real selected filename (not silent newest-on-disk)
  - Runtime start/ensure_ready no longer pick newest GGUF by mtime
  - GHCR image tagged 0.9.17 (survives container recreate)

  0.9.16 — OpenCode tool_extract + durable image tag

  - Lift text-emitted tool calls to OpenAI tool_calls (OpenCode peg-native)
  - Tool nudge + message normalize for Llama/Ministral chat templates
  - /v1/models exposes max_model_len + meta.n_ctx_train for clients
  - OpenCode export always sets limit.context; local alias for running GGUF
  - GHCR image tagged 0.9.16 (survives container recreate)

  0.9.15 — OpenCode connect + usable agent limits

  - PROXY_AUTH_WHITELIST /v1/* so OpenCode/curl work with Bearer key (no Umbrel cookie 302)
  - OpenCode export baseURL prefers LAN API URL; limit.context soft-capped ~24k (tools floor 16k)
  - Tiny trial models (LFM 230M/350M) export tools:false; prefer ≥1B for agent mode

  0.9.14 — OpenCode limits use loaded n_ctx (not GGUF train max)

  - Export limit.context from runtime/settings/bench/32k fallback — never advertise 128k–1M when server runs at 32k–65k
  - Avoids delayed compaction / context overflow with OpenCode

  0.9.13 — OpenCode multi-model + per-model context

  - GET /v1/models lists all downloaded GGUFs (real ids, not "Running GGUF")
  - Auto-switch runtime to the requested model on chat/completions
  - OpenCode export: per-model context from GGUF metadata; default = running model

  0.9.12 — Delete local models from Models tab

  - Delete button per model (confirm, stop runtime if active)

  0.9.11 — Agents quality tab + bench-all models

  - Agents tab: tool-chain gate (search→write→read→edit→diff→echo)
  - Bench one or all models; rows show max gen t/s + context

  0.9.10 — Models benchmarks + GPU/CPU offload status

  - Benchmark moved to Models with persisted per-model results
  - Current model shows GPU, GPU+CPU (partial), or CPU-only offload

  0.9.9 — HF search add-model, runtime tuning, VRAM auto-fit

  0.9.8 — Dashboard current model + context & slot activity

  0.9.7 — Session metrics (layers, temp, KV) + UI fixes

  0.9.6 — Pick AMD Vulkan device (avoid Intel-first CPU fallback)


  0.9.5 — Line-buffer llama-server logs


  0.9.4 — Real CPU/GPU device status + sidebar metrics


  0.9.0 — Local GGUF chat + OpenAI-compatible API

dependencies: []
permissions:
  - GPU
path: ""
defaultUsername: ""
defaultPassword: ""
