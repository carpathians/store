manifestVersion: 1
id: carpathians-llm-proxy
name: LLM Proxy
tagline: Local GGUF models, chat, and OpenAI-compatible API on Umbrel
icon: https://raw.githubusercontent.com/carpathians/store/main/carpathians-llm-proxy/icon.svg
category: ai
version: "0.3.2"
port: 8788
description: >-
  Download a GGUF model, run llama-server on CPU or GPU (DRI/KFD passthrough),
  and chat in the browser — or call OpenAI-compatible /v1 APIs.


  Requires /dev/dri and /dev/kfd on the host (typical on AMD/NVIDIA boxes).
  Umbrel login protects the UI via app_proxy.

developer: Carpathians
website: https://github.com/carpathians/store
submitter: Carpathians
submission: https://github.com/carpathians/store
repo: https://github.com/carpathians/llm-proxy
support: https://github.com/carpathians/store/issues
gallery:
  - https://raw.githubusercontent.com/carpathians/store/main/carpathians-llm-proxy/icon.svg
releaseNotes: >-
  0.3.2 — GPU passthrough restored


  - Mount /dev/dri + /dev/kfd and video/render groups for Vulkan/ROCm


  0.3.1 — CPU-only compose workaround (reverted in 0.3.2)


  0.3.0 — AMD + NVIDIA GPU + dashboard


  - Detect AMD and NVIDIA GPUs; Settings: auto / CPU / CUDA / Vulkan / ROCm

  - Request analytics dashboard + system CPU/RAM/VRAM


  0.2.0 — Inference + chat


  - Prebuilt llama-server (CPU) fetched on first start

  - Chat UI + OpenAI-compatible /v1 on :8788


  0.1.0 — Phase 1 download wizard
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
