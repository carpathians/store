version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: carpathians-miner-spliter_web_1
      APP_PORT: 3002

  web:
    image: ghcr.io/carpathians/miner-spliter:latest
    # No user: override — entrypoint starts as root, chowns /data, drops to 1000
    init: true
    restart: on-failure
    stop_grace_period: 1m
    ports:
      # Stratum — point ASICs at <umbrel-ip>:3333 (must be free on the host)
      - "3333:3333/tcp"
      # CG-API per virtual miner
      - "4028:4028/tcp"
      - "4029:4029/tcp"
      - "4030:4030/tcp"
    environment:
      CONFIG_PATH: /data/config.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
