name: miner-spliter
services:
  miner-spliter:
    image: ghcr.io/carpathians/miner-spliter:1.4.10@sha256:5fe50fe742d62737bc6037bcd9bdfe624dcc60d38bedd4cd6233b9a4aa519b4d
    container_name: miner-spliter
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    network_mode: bridge
    ports:
      - target: 3002
        published: "8755"
        protocol: tcp
      - target: 3333
        published: "3333"
        protocol: tcp
      - target: 4028
        published: "4028"
        protocol: tcp
      - target: 4029
        published: "4029"
        protocol: tcp
      - target: 4030
        published: "4030"
        protocol: tcp
      - target: 4031
        published: "4031"
        protocol: tcp
      - target: 4032
        published: "4032"
        protocol: tcp
      - target: 4033
        published: "4033"
        protocol: tcp
      - target: 4034
        published: "4034"
        protocol: tcp
      - target: 4035
        published: "4035"
        protocol: tcp
      - target: 4036
        published: "4036"
        protocol: tcp
      - target: 4037
        published: "4037"
        protocol: tcp
      - target: 4038
        published: "4038"
        protocol: tcp
      - target: 4039
        published: "4039"
        protocol: tcp
      - target: 4040
        published: "4040"
        protocol: tcp
      - target: 4041
        published: "4041"
        protocol: tcp
      - target: 4042
        published: "4042"
        protocol: tcp
      - target: 4043
        published: "4043"
        protocol: tcp
    environment:
      CONFIG_PATH: /data/config.json
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
x-casaos:
  id: com.carpathians.miner-spliter
  main: miner-spliter
  index: /
  port_map: "8755"
  scheme: http
  icon: https://carpathians.github.io/store/apps/com.carpathians.miner-spliter/assets/icon.svg
  title:
    en_US: SplitMiner
  version: "1.4.10"
