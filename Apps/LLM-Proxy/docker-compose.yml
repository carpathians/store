name: llm-proxy
services:
  llm-proxy:
    image: ghcr.io/carpathians/llm-proxy:0.9.30
    container_name: llm-proxy
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - target: 8788
        published: "8788"
        protocol: tcp
    environment:
      DATA_DIR: /data
      HOST: "0.0.0.0"
      PORT: "8788"
      LLM_LLAMA_BACKEND: auto
      LLM_CUDA12_URL: https://github.com/carpathians/store/releases/download/llama-cuda12/llama-bin-linux-cuda12-x64.tar.gz
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    deploy:
      resources:
        reservations:
          memory: 2G
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: -1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    x-casaos:
      envs:
        - container: LLM_LLAMA_BACKEND
          description:
            en_US: Inference backend (auto, cpu, vulkan, cuda). auto uses CUDA when nvidia-smi works (including Maxwell / K2200).
        - container: LLM_CUDA12_URL
          description:
            en_US: Public URL for the CUDA 12 Maxwell llama-server tarball.
      ports:
        - container: "8788"
          description:
            en_US: Web UI and OpenAI-compatible /v1 API
      volumes:
        - container: /data
          description:
            en_US: Models, settings, and logs

x-casaos:
  id: com.carpathians.llm-proxy
  main: llm-proxy
  index: /
  port_map: "8788"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/carpathians/store@main/Apps/LLM-Proxy/icon.svg
  title:
    en_US: LLM Proxy
  tagline:
    en_US: Local GGUF models, chat, and OpenAI-compatible API
  description:
    en_US: |
      Download a GGUF model, run llama-server, and chat in the browser — or call
      OpenAI-compatible `/v1` APIs from OpenCode, curl, and other clients.

      NVIDIA: ZimaOS GPU reservation (same as Ollama Nvidia GPU) plus
      `nvidia-smi` inside the container. CUDA 12 with Maxwell `50-virtual`
      (Quadro K2200). Vulkan for AMD.

      Create an API key in the app settings, then point clients at
      `http://YOUR_HOST_IP:8788/v1`.
  author: Carpathians
  developer: Carpathians
  category: AI
  architectures:
    - amd64
    - arm64
  version: "0.9.30"
  update_at: "2026-08-19"
  release_notes:
    en_US: |
      0.9.30 — plan GPU layers and min context; fix webfetch

      Explicit -ngl from VRAM (no llama.cpp --fit). Min context
      offloads layers. Webfetch accepts any HTTP 200.
  screenshot_link:
    - screenshot-1.png
  thumbnail: screenshot-1.png
  tips:
    before_install:
      en_US: |
        Requires a ZimaOS host with NVIDIA drivers (same as Ollama Nvidia GPU).

        After install, open port **8788** for the UI and `/v1` API.
  website: https://github.com/carpathians/store
  repo: https://github.com/carpathians/llm-proxy
  support: https://github.com/carpathians/store/issues
  docs: https://github.com/carpathians/llm-proxy
