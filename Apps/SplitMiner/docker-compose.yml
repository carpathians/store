name: miner-spliter
services:
  miner-spliter:
    image: ghcr.io/carpathians/miner-spliter:1.4.0
    container_name: miner-spliter
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    network_mode: bridge
    ports:
      - target: 3002
        published: "8755"
        protocol: tcp
      - target: 3333
        published: "3333"
        protocol: tcp
      - "4028-4043:4028-4043"
    environment:
      CONFIG_PATH: /data/config.json
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    x-casaos:
      ports:
        - container: "3002"
          description:
            en_US: Web dashboard (published on host port 8755)
        - container: "3333"
          description:
            en_US: Stratum — point ASICs at YOUR_HOST_IP:3333
        - container: "4028-4043"
          description:
            en_US: CG-API, one port per virtual miner (4028 is miner 1, up to 16 miners)
      volumes:
        - container: /data
          description:
            en_US: SplitMiner config and state

x-casaos:
  id: com.carpathians.miner-spliter
  main: miner-spliter
  index: /
  port_map: "8755"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/carpathians/store@main/Apps/SplitMiner/icon.svg
  title:
    en_US: SplitMiner
  tagline:
    en_US: Split one ASIC into multiple virtual miners with pool alternation
  description:
    en_US: |
      SplitMiner is a Stratum proxy that accepts one or more ASIC connections
      and splits them across virtual miners, each on its own pool or worker.
      Each ASIC mines its own virtual miner, at that pool's difficulty.
      Hashrate above the targets goes to OVERFLOW. The dashboard shows the
      live flow from each ASIC, plus share tracking and CG-API per virtual miner.

      First run:

      1. Open the app — configure virtual miners (pool URL, worker, optional target)
      2. Point your ASIC at `stratum+tcp://YOUR_HOST_IP:3333`
      3. Watch shares and hashrate on the dashboard

      Features:

      - Split one miner into N virtual miners
      - Optional per-VM targets in TH/s or % of total hashrate
      - Excess above targets routes to OVERFLOW when enabled
      - CG-API per VM (ports 4028–4043, up to 16 virtual miners)
      - Difficulty override for low-hashrate miners

      Host ports **3333** and **4028–4043** must be free. If another stratum proxy
      is already bound to 3333, the container will fail to start.
  author: Carpathians
  developer: Carpathians
  category: Finance
  architectures:
    - amd64
    - arm64
  version: "1.4.0"
  update_at: "2026-11-03"
  release_notes:
    en_US: |
      1.4.0

      - Each ASIC mines its own virtual miner, so three machines can cover three pools
      - ASIC difficulty follows the pool it is on, not the highest pool in the farm
      - Uncovered virtual miners are filled before OVERFLOW
      - Dashboard shows the live hashrate flow from each ASIC
      - Shares are counted at the difficulty the ASIC actually mined
  screenshot_link:
    - screenshot-1.png
  thumbnail: screenshot-1.png
  tips:
    before_install:
      en_US: |
        Requires free host ports **3333** (Stratum) and **4028–4043** (CG-API, up to 16 virtual miners).
        The dashboard is on port **8755**.

        After install, point the ASIC at `stratum+tcp://YOUR_HOST_IP:3333`.
  website: https://github.com/carpathians/store
  repo: https://github.com/carpathians/miner-spliter
  support: https://github.com/carpathians/store/issues
  docs: https://github.com/carpathians/miner-spliter
