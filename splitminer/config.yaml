name: "SplitMiner"
version: "1.4.0"
slug: "splitminer"
description: "Stratum proxy that splits one or more ASICs across virtual miners, with a built-in web dashboard."
url: "https://github.com/carpathians/store"
image: "ghcr.io/carpathians/miner-spliter"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  3002/tcp: 3002
  3333/tcp: 3333
  4028/tcp: 4028
  4029/tcp: 4029
  4030/tcp: 4030
ports_description:
  3002/tcp: "Web dashboard"
  3333/tcp: "Stratum (ASIC connects here)"
  4028/tcp: "CG-API VM 1"
  4029/tcp: "CG-API VM 2"
  4030/tcp: "CG-API VM 3"
webui: "http://[HOST]:[PORT:3002]/"
panel_icon: "mdi:axe"
panel_title: "SplitMiner"
